title: ZK-Labs Research
description: Options Volatility & Crypto Research
baseurl: "/zk-labs-research"
url: "https://poorshan.github.io"
github_username: poorshan

# Build settings
future: true  # Allow publishing posts with today's date (UTC timezone fix)
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Cayman theme is clean and professional

show_downloads: false
google_analytics:

# Social cards (X / Twitter / Open Graph)
# jekyll-seo-tag emits og:image + twitter:image from `image:`; absolute URL is
# built from `url` + `baseurl`. summary_large_image gives the wide 1.91:1 banner.
twitter:
  card: summary_large_image
  username: shangu365
logo: /assets/images/og-default.jpg
image: /assets/images/og-default.jpg
