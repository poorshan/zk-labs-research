title: ZK-Labs Research
description: Options Volatility & Crypto Research
baseurl: ""
url: "https://www.zklabsresearch.com"
github_username: poorshan

# Build settings
future: true  # Allow publishing posts with today's date (UTC timezone fix)
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Cayman theme is clean and professional

show_downloads: false
google_analytics:

# Social cards (X / Twitter / Open Graph)
# NOTE: jekyll-seo-tag (v2.8) resolves the card image ONLY from page-level front
# matter — a site-level `image:` key is silently ignored by ImageDrop. We inject
# it into every post/page via front matter defaults instead.
twitter:
  card: summary_large_image
  username: shangu365
logo: /assets/images/og-x-image.jpg
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image:
        path: /assets/images/og-x-image.jpg
        width: 1280
        height: 676
        alt: "ZK-Labs Research — Crypto & Options Research"
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /assets/images/og-x-image.jpg
        width: 1280
        height: 676
        alt: "ZK-Labs Research — Crypto & Options Research"
