---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%Y-%m-%d" }}
    </time>
    {% if page.author %}
      &nbsp;/&nbsp;作者: {{ page.author }}
    {% endif %}
  </p>

  <div class="post-content">
    {{ content }}
  </div>
</article>
